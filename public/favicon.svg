<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="flow-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>
  
  <!-- Rounded App Tile -->
  <rect width="32" height="32" rx="8" fill="url(#flow-bg)"/>
  
  <!-- Subtle inner border for depth -->
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="7.25" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="0.75"/>
  
  <!-- Upper Inflow / Right Flow Arrow -->
  <path d="M7.5 11.5 L21.5 11.5 M17.5 7.5 L22.5 11.5 L17.5 15.5" stroke="#ffffff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- Lower Outflow / Left Flow Arrow -->
  <path d="M24.5 20.5 L10.5 20.5 M14.5 16.5 L9.5 20.5 L14.5 24.5" stroke="#ffffff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- Central Balance / Currency Core -->
  <circle cx="16" cy="16" r="2.2" fill="#ffffff"/>
</svg>
